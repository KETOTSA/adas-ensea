{% extends 'base.html' %}
{% block title %}Changer le mot de passe — ADAS{% endblock %}
{% block content %}
<div style="max-width:480px;margin:0 auto">
  <div class="page-header">
    <h1><i class="bi bi-shield-lock-fill text-gold"></i> Sécurité</h1>
    <p>Modifier votre mot de passe</p>
  </div>
  
  <div class="card">
    <div class="card-body">
      <form method="POST">
        <div class="form-group">
          <label class="form-label">Mot de passe actuel</label>
          <input type="password" name="current_password" class="form-control" required/>
        </div>
        <div class="form-group">
          <label class="form-label">Nouveau mot de passe</label>
          <input type="password" name="new_password" class="form-control" required minlength="8"/>
          <small style="color:#94a3b8;font-size:0.78rem">Au moins 8 caractères</small>
        </div>
        <div class="form-group">
          <label class="form-label">Confirmer le nouveau mot de passe</label>
          <input type="password" name="confirm_password" class="form-control" required minlength="8"/>
        </div>
        <div style="display:flex;gap:0.75rem">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-lg"></i> Enregistrer
          </button>
          <a href="{{ url_for('student.profil') if not current_user.is_admin() else url_for('admin.dashboard') }}" 
             class="btn btn-secondary">Annuler</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
