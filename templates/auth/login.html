<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0a2342"/>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}"/>
  <title>Connexion — ADAS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}"/>
</head>
<body style="margin:0;padding:0;">

<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-sigma">Σ</div>
      <div class="login-title">ADAS</div>
      <div class="login-sub">Division des Analystes Statisticiens</div>
    </div>
    
    <div class="login-body">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for cat, msg in messages %}
            <div class="flash flash-{{ cat }}" style="margin-bottom:1rem">
              {{ msg }}
              <button class="flash-close" onclick="this.parentElement.remove()">×</button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      
      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="form-group">
          <label class="form-label">
            <i class="bi bi-person-fill"></i> Identifiant
          </label>
          <input type="text" name="username" class="form-control" 
                 placeholder="Votre identifiant" required autocomplete="username"
                 value="{{ request.form.get('username', '') }}"/>
        </div>
        
        <div class="form-group">
          <label class="form-label">
            <i class="bi bi-lock-fill"></i> Mot de passe
          </label>
          <div style="position:relative">
            <input type="password" name="password" id="passwordInput" class="form-control" 
                   placeholder="••••••••" required autocomplete="current-password"
                   style="padding-right:2.5rem"/>
            <button type="button" onclick="togglePw()" 
                    style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#94a3b8;font-size:1rem">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>
        
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem">
          <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;cursor:pointer">
            <input type="checkbox" name="remember" style="accent-color:#0a2342"/>
            Se souvenir de moi
          </label>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <i class="bi bi-box-arrow-in-right"></i> Se connecter
        </button>
      </form>
      
      <div style="margin-top:2rem;padding-top:1.5rem;border-top:1px solid #e2e8f0;text-align:center">
        <p style="font-size:0.8rem;color:#94a3b8">
          Division des Analystes Statisticiens<br/>
          Portail académique sécurisé
        </p>
      </div>
    </div>
  </div>
</div>

<script>
function togglePw() {
  const input = document.getElementById('passwordInput');
  const icon = document.getElementById('eyeIcon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'bi bi-eye-slash';
  } else {
    input.type = 'password';
    icon.className = 'bi bi-eye';
  }
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/js/sw.js');
}
</script>
</body>
</html>
